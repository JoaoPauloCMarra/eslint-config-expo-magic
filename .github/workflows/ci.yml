name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun run ci

      - name: Typecheck public types
        run: bun run typecheck

      - name: Audit dependencies
        run: bun run audit:deps

      - name: Run unit tests
        run: bun run test

      - name: Check committed release reports
        run: bun run report:check

  fixture-validation:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun run ci

      - name: Run fixture validation
        run: bun run validate

  packed-consumer:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lane: [--lane sdk-54, --lane sdk-55, --lane sdk-56, --lane sdk-57, --npm-only]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun run ci

      - name: Run packed-consumer smoke checks
        run: bun scripts/smoke-packed-consumer.js ${{ matrix.lane }}

  clean-sdk57-consumer:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun run ci

      - name: Run clean SDK 57 consumer smoke
        run: bun run smoke:clean-sdk57
