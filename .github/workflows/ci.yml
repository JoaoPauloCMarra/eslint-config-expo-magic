name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# bun lint ships only in Bun canary for now. Switch to `latest` once a stable
# release has it.
jobs:
  unit-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun run ci

      - name: Check formatting
        run: bun fmt --check

      - name: Typecheck public types
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test

  golden:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun run ci

      - name: Compare every profile with the 5.x golden data
        run: bun run golden:bun

  consumer:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun run ci

      - name: Install the packed package in a clean consumer
        run: bun run smoke:bun-consumer
